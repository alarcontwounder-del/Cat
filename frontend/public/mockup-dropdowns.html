<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropdown Glass Mockup - White Text</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen" style="background: #CCFF00;">

<div class="py-16 px-8">
  <h1 class="text-center text-sm font-bold text-black/50 mb-10 uppercase tracking-wider">Dropdowns with White Text/Icons on GIM Glass</h1>

  <div class="max-w-3xl mx-auto flex justify-center gap-16">

    <!-- Language Dropdown -->
    <div class="relative">
      <button class="flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-semibold bg-white/10 backdrop-blur-sm border border-white/15" style="color: #f6416c;">
        EN <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <!-- Dropdown open -->
      <div class="absolute left-0 top-full mt-1 bg-white/10 backdrop-blur-xl rounded-xl shadow-xl border border-white/15 py-1 min-w-[140px] z-50">
        <button class="w-full text-left px-4 py-2 text-sm hover:bg-white/15 transition-colors flex items-center justify-between font-semibold text-white">
          <span>English</span><span class="text-xs text-white/50">EN</span>
        </button>
        <button class="w-full text-left px-4 py-2 text-sm hover:bg-white/15 transition-colors flex items-center justify-between text-white/80">
          <span>Español</span><span class="text-xs text-white/50">ES</span>
        </button>
        <button class="w-full text-left px-4 py-2 text-sm hover:bg-white/15 transition-colors flex items-center justify-between text-white/80">
          <span>Català</span><span class="text-xs text-white/50">CA</span>
        </button>
        <button class="w-full text-left px-4 py-2 text-sm hover:bg-white/15 transition-colors flex items-center justify-between text-white/80">
          <span>Deutsch</span><span class="text-xs text-white/50">DE</span>
        </button>
        <button class="w-full text-left px-4 py-2 text-sm hover:bg-white/15 transition-colors flex items-center justify-between text-white/80">
          <span>Français</span><span class="text-xs text-white/50">FR</span>
        </button>
        <button class="w-full text-left px-4 py-2 text-sm hover:bg-white/15 transition-colors flex items-center justify-between text-white/80">
          <span>Svenska</span><span class="text-xs text-white/50">SE</span>
        </button>
      </div>
    </div>

    <!-- Weather Dropdown -->
    <div class="relative">
      <button class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-semibold bg-white/10 backdrop-blur-sm border border-white/15" style="color: #f6416c;">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        12°C
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <!-- Dropdown open -->
      <div class="absolute right-0 top-full mt-1 bg-white/10 backdrop-blur-xl rounded-xl shadow-xl border border-white/15 p-3 w-[160px] z-50">
        <div class="flex items-center gap-2.5 pb-2.5 mb-2 border-b border-white/15">
          <svg class="w-5 h-5 text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
          <div>
            <p class="text-[10px] text-white/50 uppercase tracking-wider">Barcelona, Today</p>
            <p class="text-lg font-semibold text-white">12°C</p>
          </div>
        </div>
        <div class="space-y-1">
          <div class="flex items-center justify-between text-xs py-0.5">
            <span class="text-white/60 w-8 font-medium">Thu</span>
            <svg class="w-3.5 h-3.5 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <span class="text-white font-semibold w-8 text-right">16°</span>
            <span class="text-white/40 w-8 text-right">8°</span>
          </div>
          <div class="flex items-center justify-between text-xs py-0.5">
            <span class="text-white/60 w-8 font-medium">Fri</span>
            <svg class="w-3.5 h-3.5 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
            <span class="text-white font-semibold w-8 text-right">14°</span>
            <span class="text-white/40 w-8 text-right">7°</span>
          </div>
          <div class="flex items-center justify-between text-xs py-0.5">
            <span class="text-white/60 w-8 font-medium">Sat</span>
            <svg class="w-3.5 h-3.5 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <span class="text-white font-semibold w-8 text-right">18°</span>
            <span class="text-white/40 w-8 text-right">9°</span>
          </div>
          <div class="flex items-center justify-between text-xs py-0.5">
            <span class="text-white/60 w-8 font-medium">Sun</span>
            <svg class="w-3.5 h-3.5 text-white/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <span class="text-white font-semibold w-8 text-right">19°</span>
            <span class="text-white/40 w-8 text-right">10°</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="text-center py-4">
  <p class="text-black/30 text-xs">GIM glass (bg-white/10 backdrop-blur-xl border-white/15) + white text/icons</p>
</div>

</body>
</html>
