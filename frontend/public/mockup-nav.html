<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIM Language + Weather Mockup</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-200 min-h-screen">

<div class="bg-white py-6 px-8 text-center border-b">
  <h1 class="text-xl font-bold text-stone-800 mb-1">Language + Weather Mockup</h1>
  <p class="text-stone-500 text-sm">GIM exact structure adapted for lime navbar</p>
</div>

<!-- GIM REFERENCE (white text on dark bg) -->
<div class="py-8 px-8">
  <h2 class="text-sm font-bold text-stone-500 mb-4 text-center uppercase tracking-wider">Original GIM (on dark bg)</h2>
  <div class="max-w-3xl mx-auto py-4 px-8 flex items-center justify-end gap-3" style="background: #2D2D2D;">
    <!-- GIM Language -->
    <button class="flex items-center gap-1.5 px-4 py-2 rounded-full border transition-colors duration-300 text-sm border-white/50 text-white hover:border-white">
      <span class="text-sm font-semibold">EN</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <!-- GIM Weather -->
    <button class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm transition-all duration-200 bg-white/10 backdrop-blur-sm border border-white/15 text-white/80 hover:bg-white/20">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
      <span class="font-semibold">12°C</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
</div>

<!-- ADAPTED FOR LIME NAVBAR -->
<div class="py-8 px-8">
  <h2 class="text-sm font-bold text-stone-500 mb-4 text-center uppercase tracking-wider">Adapted for Golfgate lime navbar (#CCFF00)</h2>
  <div class="max-w-3xl mx-auto py-4 px-8 flex items-center justify-end gap-3" style="background: #CCFF00;">
    <!-- Language - GIM structure, dark colors for lime bg -->
    <button class="flex items-center gap-1.5 px-4 py-2 rounded-full border transition-colors duration-300 text-sm border-black/30 text-black/80 hover:border-black/50">
      <span class="text-sm font-semibold">EN</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <!-- Weather - GIM structure, dark colors for lime bg -->
    <button class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm transition-all duration-200 bg-black/8 backdrop-blur-sm border border-black/10 text-black/70 hover:bg-black/15">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
      <span class="font-semibold">13°C</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
</div>

<div class="bg-white py-4 px-8 text-center border-t mt-8">
  <p class="text-stone-400 text-xs">Structure: exact GIM code | Colors: inverted for lime bg</p>
</div>

</body>
</html>
