<html lang="en">

<title>Navbar Mockup - White Text + Glass Pills</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen" style="background: #F5FFF0;">

</div>

        </div>
      </div>
    </nav>
  </div>

  <!-- PROPOSED -->
  <div>
    <h3 class="text-xs font-bold text-stone-400 mb-3 text-center uppercase tracking-wider">Proposed — White text (larger), Glass lime pills, Dark grey gear (larger)</h3>
    <nav class="shadow-md rounded-xl overflow-hidden" style="background: #CCFF00;">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
        <img src="https://golfgate-cat.preview.emergentagent.com/golfgate-logo-nav.png" alt="GOLFGATE" class="h-20 w-auto" />

      </div>

</div>

<div class="text-center mt-12 py-4">
  <p class="text-stone-400 text-xs">Current vs Proposed — pick your preference</p>
</div>

</html>
